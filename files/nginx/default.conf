map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    limit_req zone=general_limit burst=20 nodelay;

    # Fast 404 block for exploit probes with dedicated suspicious.log
    location ~* ^/(\.env|phpunit|cgi-bin|\.git|\.aws|\.docker|wp-admin|wp-content|setup\.php|phpinfo\.php|eval-stdin) {
        access_log /var/log/nginx/suspicious.log main;
        return 404;
    }

    ssl_certificate /etc/nginx/certs/velvetacare.com.crt;
    ssl_certificate_key /etc/nginx/certs/velvetacare.com.key;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.velvetacare.com;

    set $erp_prod_upstream frontend:8080;

    location ~* ^/(?:assets|files|.*\.(?:css|js|woff2?|ttf|otf|svg|png|jpe?g|gif|ico|webp|mp3)) {
        access_log /var/log/nginx/assets.log main buffer=256k flush=5s;

        proxy_pass http://$erp_prod_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^http://[^/]+:8080(/.*)$ https://$host$1;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://$erp_prod_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^http://[^/]+:8080(/.*)$ https://$host$1;
        proxy_read_timeout 120s;
    }
}

